<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Synth Station Guide (MPK · APC40 · PAD)</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --btn: #26354d;
      --btn-hover: #334155;
      --btn-border: rgba(148, 163, 184, 0.28);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 14px 12px 34px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--btn-border);
      border-radius: 14px;
      padding: 15px 16px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.25;
    }
    .pill {
      font-size: 12.5px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      white-space: nowrap;
    }
    .grid-1 {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .tg-btn {
      appearance: none;
      width: 100%;
      min-height: 62px;
      background: var(--btn);
      color: var(--text);
      border: 1.5px solid var(--btn-border);
      border-radius: 13px;
      padding: 17px 16px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      transition: background 0.12s ease, transform 0.06s ease;
    }
    .grid-3 .tg-btn {
      min-height: 82px;
      font-size: 19px;
      padding: 18px 10px;
    }
    .grid-2 .tg-btn {
      min-height: 68px;
      font-size: 18px;
      padding: 17px 12px;
    }
    .grid-1 .tg-btn {
      justify-content: flex-start;
      text-align: left;
      font-size: 17.5px;
      padding: 17px 18px;
    }
    .tg-btn:active {
      background: var(--btn-hover);
      transform: scale(0.985);
    }
    .tg-btn.back {
      margin-top: 12px;
      min-height: 60px;
      font-size: 18px;
      background: rgba(30, 41, 59, 0.92);
      color: var(--muted);
      justify-content: center;
      text-align: center;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card);
      border: 1.5px solid rgba(148, 163, 184, 0.36);
      border-radius: 16px;
      max-width: 460px;
      width: 100%;
      padding: 20px 20px 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }
    .modal-body {
      white-space: pre-line;
      font-size: 17.5px;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 18px;
    }
    .modal-ok {
      width: 100%;
      min-height: 54px;
      background: rgba(56, 189, 248, 0.2);
      color: var(--accent);
      border: 1.5px solid rgba(56, 189, 248, 0.42);
      border-radius: 12px;
      padding: 13px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title" id="page-title">🎹 Synth Hub</div>
      <div class="pill" id="offline-pill">Offline App</div>
    </div>
    <div id="btn-container"></div>
    <div id="back-container"></div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-body" id="modal-body"></div>
      <button class="modal-ok" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    let MENUS = {};
    let currentPage = "synth_hub";

    function showPopup(text) {
      document.getElementById("modal-body").textContent = text;
      document.getElementById("modal-backdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modal-backdrop").classList.remove("open");
    }

    function render(pageId, pushHash = true) {
      const page = MENUS[pageId] || MENUS["synth_hub"];
      if (!page) return;
      currentPage = pageId;
      if (pushHash) history.replaceState(null, "", "#" + pageId);

      document.getElementById("page-title").innerHTML = page.title;
      const box = document.getElementById("btn-container");
      box.className = page.layout === "3col" ? "grid-3" : (page.layout === "2col" ? "grid-2" : "grid-1");
      box.innerHTML = "";

      (page.items || []).forEach((it) => {
        if (it.pdf) {
          const a = document.createElement("a");
          a.className = "tg-btn";
          a.href = it.pdf;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = it.label;
          box.appendChild(a);
          return;
        }
        const b = document.createElement("button");
        b.className = "tg-btn";
        b.textContent = it.label;
        b.onclick = () => {
          if (it.popup) showPopup(it.popup);
          else if (it.goto) render(it.goto);
        };
        box.appendChild(b);
      });

      const backBox = document.getElementById("back-container");
      backBox.innerHTML = "";
      if (page.back && MENUS[page.back]) {
        const backBtn = document.createElement("button");
        backBtn.className = "tg-btn back";
        backBtn.textContent = page.back_label || "🔙 Back";
        backBtn.onclick = () => render(page.back);
        backBox.appendChild(backBtn);
      }
    }

    fetch("./menus.json")
      .then((r) => r.json())
      .then((data) => {
        MENUS = data;
        const hash = (location.hash || "").replace(/^#/, "");
        render(MENUS[hash] ? hash : "synth_hub", false);
      });

    window.addEventListener("hashchange", () => {
      const hash = (location.hash || "").replace(/^#/, "");
      if (MENUS[hash] && hash !== currentPage) render(hash, false);
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").then(() => {
        document.getElementById("offline-pill").textContent = "✓ Offline Ready";
      }).catch(() => {});
    }

    window.addEventListener("load", () => {
      if (window.Telegram && window.Telegram.WebApp) {
        try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (_) {}
      }
    });
  </script>
</body>
</html>
